name: Release

on:
  push:
    tags: ['v*']                  # only runs for pushed tags starting with v (v0.1.0, v1.2.3...), not for branches

permissions:                      # the token GitHub gives the job is read-only by default
  contents: write                 # grant write access so the job is allowed to create a release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # checks out the commit that the tag points at
      - name: Build
        run: make                 # compile fresh, so the released binary matches the tagged source
      - name: Create release
        uses: softprops/action-gh-release@v2   # third-party action that creates the GitHub Release page
        with:
          files: kilo             # attach the compiled binary to that release as a downloadable asset
