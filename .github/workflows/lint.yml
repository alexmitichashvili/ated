name: Static analysis             # name in the Actions tab

on: [push, pull_request]          # short form: run on any push to any branch, and on PRs

jobs:
  cppcheck:                       # job id
    runs-on: ubuntu-latest        # Linux VM — needed because we install a package with apt
    steps:
      - uses: actions/checkout@v4 # clone the repo onto the VM
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
                                  # 'update' refreshes the package lists; -y auto-confirms the install
      - name: Run cppcheck
        run: cppcheck --enable=warning,style --error-exitcode=1 main.c
                                  # --enable turns on extra check categories beyond the defaults
                                  # --error-exitcode=1 makes findings fail the job instead of just printing
