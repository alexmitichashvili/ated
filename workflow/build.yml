name: Build                       # label shown in the Actions tab and in commit status checks

on:                               # the events that trigger this workflow
  push:                           # run when commits are pushed...
    branches: [main]              # ...but only to the main branch, not to every branch
  pull_request:                   # also run on every pull request, so bad code is caught before merge

jobs:                             # a workflow contains one or more jobs; jobs run in parallel by default
  build:                          # internal id of this job (your choice of name)
    runs-on: ubuntu-latest        # the throwaway VM this job executes on
    steps:                        # the ordered list of things to do on that VM
      - uses: actions/checkout@v4 # pre-made action that clones your repo onto the empty VM; always step one
      - name: Compile             # human-readable label for this step in the logs
        run: make                 # shell command executed on the VM; calls your Makefile
      - name: Check binary exists
        run: test -x ./ated       # fails the job if the binary wasn't produced or isn't executable
      - uses: actions/upload-artifact@v4   # action that saves files from the VM before it's destroyed
        with:                     # 'with' passes inputs to the action above
          name: ated-binary       # the name the download will appear under on the run's summary page
          path: ated              # which file(s) to save
